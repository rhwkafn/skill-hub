[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-hub"
version = "0.1.0"
description = "A lightweight skill registry that treats agent skills like RAG — index-first, load-on-demand."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/skill_hub"]

[tool.ruff]
target-version = "py310"
line-length = 100
