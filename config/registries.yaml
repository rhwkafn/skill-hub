# Skill registries — sources to sync from.
# Each entry can be a GitHub repo, a local path, or a URL.

registries:
  - name: codex-skills-workbench
    type: local
    path: "D:/AI-agent/claude-app/codex-reaserch/codex-skills-workbench"
    skill_glob: "skills/*/SKILL.md"
    manifest: "manifests/skills.json"

  - name: nature-skills
    type: github
    repo: "Yuan1z0825/nature-skills"
    skill_glob: "*/SKILL.md"

  - name: codex-skills-workbench-github
    type: github
    repo: "Jinze-Lee/codex-skills-workbench"
    skill_glob: "skills/*/SKILL.md"

  - name: scientific-agent-skills
    type: github
    repo: "K-Dense-AI/scientific-agent-skills"
    skill_glob: "scientific-skills/*/SKILL.md"
